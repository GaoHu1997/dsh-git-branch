name: CI

# Continuous verification only — publishing lives in release.yml, which is
# tag-driven. `lib/` is gitignored, so every check here builds it from source.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version` input on purpose: the action reads packageManager from
      # package.json (pnpm@11.8.0), and passing both is an error.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile keeps CI on the exact versions developers resolved;
      # peers stay unfetched via auto-install-peers=false in .npmrc.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck client
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build host and client
        run: pnpm run build:all

      - name: Upload built plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-lib
          path: lib/
          if-no-files-found: error
          retention-days: 7
